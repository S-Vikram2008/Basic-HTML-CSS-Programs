<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        * { 
            box-sizing: border-box;
          }

        body{
                background-color: rgb(69, 75, 227);
                display: flex;
                justify-content: center;
                margin-top: 100px;
            }

        .container{
                background-color: white;
                border-radius: 20px;
                padding: 20px;
                width: 400px;
                box-shadow: 5px 5px 30px 5px yellow,
                -5px -5px 30px 5px orange;
            }

        p{
                font-size: 20px; 
         }

        #username,#password{
                font-size: 18px;
                outline: none;
                width: 300px;
                border-radius: 4px;
                padding-left: 10px;
                padding-right: 10px;
                padding-top: 5px;
                padding-bottom: 5px;
            }

        .submit{
                color:white;
                background-color: red;
                font-size: 24px;
                cursor: pointer;
                border-radius: 10px;
                
            }
        
        

        .reset{
                color: white;
                background-color: blue;
                font-size: 24px;
                cursor: pointer;
                border-radius: 10px;
            }
            
        span{
                font-size: 16px;
            }

        a{
                color: blue;
            }

        input:focus{
            border-color: rgb(50, 11, 241); 
            }

    </style>

</head>
<body>
    <div class="container">
    <form method="post">
        <p>Enter your username : </p>
            <input id="username" name="username"  type="text" placeholder="Enter your name" required>
        <br>
        <p>Enter your password : </p>
            <input id="password" name="password" type="password" placeholder="Enter your password" required>
        <br><br>
        <input type="checkbox"><span>Remember me </span>
        <br><br><br>
        <a href="signup.html">Don't have an account? Sign up  </a>
        <br><br><br>

        <input class="submit" type="submit">
        <input class="reset" type="reset">
        
        
        
    </form>

    </div>

    
</body>
</html>
